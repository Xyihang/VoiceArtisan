[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwentts"
description = "声匠 · VoiceSmith 后端（多引擎语音工作台）"
readme = "../README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# 装了这个包（pip install -e backend）之后，MCP 客户端只需要 command = "qwentts-mcp"
qwentts-mcp = "app.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
