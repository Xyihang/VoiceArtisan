[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwentts"
description = "声匠 · VoiceArtisan 后端（多引擎语音工作台）"
readme = "../README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# 装了这个包（pip install -e backend）之后，MCP 客户端只需要 command = "voiceartisan-mcp"
voiceartisan-mcp = "app.mcp_server:main"
# 兼容旧配置：v1.1.62 及更早的教程里写的是 qwentts-mcp，保持可用
qwentts-mcp = "app.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
