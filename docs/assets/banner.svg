<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="声匠 VoiceArtisan — 多引擎语音工作台">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#060a11"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0" r="0.9">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8cacd4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glowA)"/>
  <rect width="1280" height="320" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#8cacd4" stroke-opacity="0.16"/>

  <!-- 标记 -->
  <rect x="56" y="66" width="72" height="72" rx="20" fill="url(#mark)"/>
  <text x="92" y="116" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700"
        fill="#04121f" text-anchor="middle">匠</text>

  <!-- 主标题 -->
  <text x="152" y="104" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="46" font-weight="700"
        fill="#eef4ff" letter-spacing="2">声匠 · VoiceArtisan</text>
  <text x="152" y="140" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17"
        fill="#9db2cd" letter-spacing="3.2">LOCAL + CLOUD TTS / ASR WORKBENCH</text>

  <!-- 一句话 -->
  <text x="152" y="184" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" fill="#c8d6e8">
    在自己电脑上跑 13 个语音引擎：文字转语音、零样本克隆、音色设计、录音转写
  </text>
  <text x="152" y="214" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" fill="#c8d6e8">
    显存不够就借云端 GPU，还能通过 MCP 让别的 AI 直接调用
  </text>

  <!-- 能力胶囊 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
    <rect x="152" y="242" width="118" height="30" rx="15" fill="#4c8dff" fill-opacity="0.14" stroke="#4c8dff" stroke-opacity="0.45"/>
    <text x="211" y="262" fill="#a9c7ff" text-anchor="middle">13 引擎</text>

    <rect x="282" y="242" width="118" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text x="341" y="262" fill="#8ee9dc" text-anchor="middle">13 语言</text>

    <rect x="412" y="242" width="130" height="30" rx="15" fill="#8cacd4" fill-opacity="0.08" stroke="#8cacd4" stroke-opacity="0.28"/>
    <text x="477" y="262" fill="#a9b8cc" text-anchor="middle">60+ 设置项</text>

    <rect x="554" y="242" width="150" height="30" rx="15" fill="#8cacd4" fill-opacity="0.08" stroke="#8cacd4" stroke-opacity="0.28"/>
    <text x="629" y="262" fill="#a9b8cc" text-anchor="middle">MCP · 9 工具</text>

    <rect x="716" y="242" width="170" height="30" rx="15" fill="#8cacd4" fill-opacity="0.08" stroke="#8cacd4" stroke-opacity="0.28"/>
    <text x="801" y="262" fill="#a9b8cc" text-anchor="middle">Windows 一键安装</text>
  </g>

  <!-- 右侧波形 -->
  <g stroke="#4c8dff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M1060 160v-18"/><path d="M1078 160v-44"/><path d="M1096 160v-70"/>
    <path d="M1114 160v-96"/><path d="M1132 160v-64"/><path d="M1150 160v-110"/>
    <path d="M1168 160v-38"/><path d="M1186 160v-76"/><path d="M1204 160v-24"/>
  </g>
  <g stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <path d="M1060 168v18"/><path d="M1078 168v44"/><path d="M1096 168v70"/>
    <path d="M1114 168v96"/><path d="M1132 168v64"/><path d="M1150 168v110"/>
    <path d="M1168 168v38"/><path d="M1186 168v76"/><path d="M1204 168v24"/>
  </g>
  <text x="1132" y="306" font-family="Consolas, monospace" font-size="12" fill="#7d93ad" text-anchor="middle"
        letter-spacing="1.2">first_packet ≤ 1.5s</text>
</svg>
